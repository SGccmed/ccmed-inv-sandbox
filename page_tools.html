<!-- Shared page tools. auth.add_user_block() adds this to every page with a sidebar.
     1. Rich text: any <textarea data-rich> becomes a Trix editor (bold with Ctrl+B, numbered and bulleted lists
        that continue on Enter). Trix is open source (MIT, 37signals) and served from this app: trix.js / trix.css.
     2. Money fields: any <input data-money> turns red with a warning if it's negative or not a number, and the
        form's submit button is greyed out until it's fixed.
     3. Work time: inside a form, inputs data-time="start" and data-time="end" fill in [data-time-total] (hours).
     4. Favorites: the ☆ Favorite button (top right) pins the page to your home page. Opening a record also
        adds it to "Recent" on the home page.
     5. Pick lists (v1.10, manufacturers locked in v1.11): the drop-down lists below come from choices.py.
        An input with list="dl-locations", "dl-places" or "dl-manufacturers" and data-strict must be a value
        from its list: anything else turns red and greys out the submit button, like a bad cost
        (data-current="<old value>" lets an unchanged old value stay). Typed values are tidied to the list's
        spelling ("a1" becomes "A1", "cannon" becomes "Canon/Toshiba"). -->
<datalist id="dl-locations">
  {% for loc in LOCATIONS %}
    <option value="{{ loc }}">
  {% endfor %}
</datalist>
<datalist id="dl-places">
  {% for loc in PLACES %}
    <option value="{{ loc }}">
  {% endfor %}
</datalist>
<datalist id="dl-manufacturers" data-aliases='{{ MANUFACTURER_ALIASES|tojson }}'>
  {% for m in MANUFACTURERS %}
    <option value="{{ m }}">
  {% endfor %}
</datalist>
<style>
  a.brandlink,
  a.brandlink:hover {
    color: inherit !important;
    text-decoration: none !important;
    background: none !important;
    padding: 0 !important;
    display: block
  }
  .favbtn {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 30;
    background: #ffffff;
    color: #245d86;
    border: 1px solid #cdd9e4;
    border-radius: 999px;
    padding: 6px 13px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(17, 42, 66, .08)
  }
  .favbtn.on {
    background: #fff6d6;
    border-color: #f0d49b;
    color: #7a5600
  }
  .time-total {
    font-weight: 700;
    padding: 10px 0
  }
  input.money-bad {
    border-color: #c0392b !important;
    background: #fdecea !important;
    color: #8e1f15 !important
  }
  .money-warn {
    color: #b3261e;
    font-size: 12px;
    font-weight: 600;
    margin-top: 4px
  }
  input[readonly]:not([type=hidden]),
  select:disabled {
    background: #f1f4f7 !important;
    color: #5d6f80 !important;
    cursor: not-allowed
  }
  button:disabled,
  button[disabled] {
    opacity: .45;
    cursor: not-allowed
  }
  trix-toolbar .trix-button-group--file-tools {
    display: none !important
  }
  trix-editor {
    min-height: 140px;
    background: #ffffff;
    border: 1px solid #cdd9e4 !important;
    border-radius: 8px !important;
    padding: 10px 12px !important;
    line-height: 1.5;
    color: #182b3c
  }
  trix-editor:focus {
    outline: 2px solid #245d86;
    outline-offset: 1px
  }
  trix-toolbar .trix-button-row {
    flex-wrap: wrap
  }
  trix-editor ol,
  trix-editor ul {
    padding-left: 22px
  }
</style>
<script>
  (function () {
    // ---- Rich text editors ----
    function looksLikeHtml(text) {
      return /<(div|p|br|strong|b|em|i|ol|ul|li|h1|blockquote|pre|del|a)\b/i.test(text);
    }

    function plainToHtml(text) {
      return text.split(/\n/).map(function (line) {
        var safe = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return '<div>' + (safe || '<br>') + '</div>';
      }).join('');
    }

    function upgrade(area, n) {
      var id = 'rich-' + n;
      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = area.name;
      input.id = id;
      input.value = looksLikeHtml(area.value) ? area.value : plainToHtml(area.value);
      if (!area.value.trim()) input.value = '';
      var editor = document.createElement('trix-editor');
      editor.setAttribute('input', id);
      if (area.placeholder) editor.setAttribute('placeholder', area.placeholder);
      area.parentNode.insertBefore(input, area);
      area.parentNode.insertBefore(editor, area);
      area.remove();
    }

    function loadEditors() {
      var areas = document.querySelectorAll('textarea[data-rich]');
      if (!areas.length) return;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = '/assets/trix.css';
      document.head.appendChild(css);
      var js = document.createElement('script');
      js.src = '/assets/trix.js';
      js.onload = function () { areas.forEach(upgrade); };
      document.head.appendChild(js);
    }
    // No file attachments in notes (Trix allows drag-and-drop of files by default).
    document.addEventListener('trix-file-accept', function (e) { e.preventDefault(); });

    // ---- Money fields ----
    function moneyProblem(value) {
      var v = value.trim().replace(/[$,]/g, '');
      if (!v) return '';
      if (!/^-?\d*\.?\d*$/.test(v) || v === '.' || v === '-') return 'Enter a number, like 125.50';
      if (parseFloat(v) < 0) return 'Costs can’t be negative. Remove the minus sign.';
      return '';
    }

    // ---- Pick lists (locations must come from the list; manufacturers are suggestions) ----
    function squash(v) { return String(v || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
    function listOptions(input) {
      var dl = document.getElementById(input.getAttribute('list') || '');
      return dl ? Array.prototype.map.call(dl.options, function (o) { return o.value; }) : [];
    }
    function listMatch(input) {
      var v = squash(input.value);
      var dl = document.getElementById(input.getAttribute('list') || '');
      var aliases = dl && dl.dataset.aliases ? JSON.parse(dl.dataset.aliases) : {};   // e.g. "cannon" -> "Canon/Toshiba"
      return listOptions(input).filter(function (o) { return squash(o) === v; })[0] || aliases[v];
    }
    function pickProblem(input) {
      var v = input.value.trim();
      if (!v || listMatch(input)) return '';
      if (input.dataset.current && squash(v) === squash(input.dataset.current)) return '';
      return input.getAttribute('list') === 'dl-manufacturers' ? 'Pick a manufacturer from the list' : 'Pick a location from the list';
    }

    // One message box under a field, created when needed.
    function note(input, cls, text) {
      var box = input.parentNode.querySelector('.' + cls);
      if (text && !box) {
        box = document.createElement('div');
        box.className = cls;
        input.insertAdjacentElement('afterend', box);
      }
      if (box) {
        box.textContent = text;
        box.style.display = text ? 'block' : 'none';
      }
    }

    function checkForm(form) {
      var bad = false;
      form.querySelectorAll('input[data-money], input[data-strict]').forEach(function (input) {
        var problem = input.hasAttribute('data-money') ? moneyProblem(input.value) : pickProblem(input);
        input.classList.toggle('money-bad', !!problem);
        note(input, 'money-warn', problem);
        bad = bad || !!problem;
      });
      form.querySelectorAll('button:not([type=button])').forEach(function (b) {
        b.disabled = bad;
        b.title = bad ? 'Fix the highlighted field first' : '';
      });
    }

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.matches && t.matches('input[data-money], input[data-strict]') && t.form) checkForm(t.form);
    });
    // Leaving a list field: use the list's spelling.
    document.addEventListener('change', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('input[list^="dl-"]'))) return;
      var match = listMatch(t);
      if (match) t.value = match;
      if (t.form) checkForm(t.form);
    });

    // ---- Work time: Start / End -> Total hours ----
    function updateTotals(form) {
      var start = form.querySelector('[data-time=start]'), end = form.querySelector('[data-time=end]');
      var out = form.querySelector('[data-time-total]');
      if (!start || !end || !out) return;
      var a = start.value.split(':'), b = end.value.split(':');
      if (!start.value || !end.value) { out.textContent = '—'; out.style.color = ''; return; }
      var mins = (+b[0] * 60 + +b[1]) - (+a[0] * 60 + +a[1]);
      if (mins <= 0) { out.textContent = 'End must be after start'; out.style.color = '#b3261e'; return; }
      out.textContent = (mins / 60).toFixed(2) + ' hrs'; out.style.color = '';
    }
    ['input', 'change'].forEach(function (type) {
      document.addEventListener(type, function (e) {
        if (e.target.matches && e.target.matches('[data-time]') && e.target.form) updateTotals(e.target.form);
      });
    });

    // ---- Favorites and recent pages ----
    function pageLabel() {
      var h = document.querySelector('main h1, .content h1, h1');
      return (h ? h.innerText : document.title).trim().slice(0, 120);
    }
    function setupFavorite() {
      if (location.pathname === '/') return;
      var url = location.pathname + location.search;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'favbtn';
      btn.textContent = '☆ Favorite';
      document.body.appendChild(btn);
      function show(on) { btn.classList.toggle('on', on); btn.textContent = on ? '★ Favorited' : '☆ Favorite'; }
      fetch('/api/favorite?url=' + encodeURIComponent(url)).then(function (r) { return r.json(); }).then(function (d) { show(d.fav); }).catch(function () {});
      btn.addEventListener('click', function () {
        fetch('/api/favorite', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url, label: pageLabel() }) })
          .then(function (r) { return r.json(); }).then(function (d) { show(d.fav); }).catch(function () {});
      });
      fetch('/api/page-visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url, label: pageLabel() }) }).catch(function () {});
    }

    function start() { loadEditors(); setupFavorite(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
</script>
