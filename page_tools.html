<!-- Shared page tools. auth.add_user_block() adds this to every page with a sidebar.
     1. Rich text: any <textarea data-rich> becomes a Trix editor (bold with Ctrl+B, numbered and bulleted lists
        that continue on Enter). Trix is open source (MIT, 37signals) and served from this app: trix.js / trix.css.
     2. Money fields: any <input data-money> turns red with a warning if it's negative or not a number, and the
        form's submit button is greyed out until it's fixed.
     3. Work time: inside a form, inputs data-time="start" and data-time="end" fill in [data-time-total] (hours).
     4. Favorites: the ☆ Favorite button (top right) pins the page to your home page. Opening a record also
        adds it to "Recent" on the home page.
     5. Pick lists (v1.10, manufacturers locked in v1.11, app-drawn drop-downs in v1.14): the lists below come
        from choices.py. An input with data-combo="dl-locations", "dl-places", "dl-manufacturers", "dl-products"
        or "customers" gets the app's own drop-down (8 rows, then it scrolls). With data-strict the value must come
        from the list: anything else turns red and greys out the submit button, like a bad cost
        (data-current="<old value>" lets an unchanged old value stay). Typed values are tidied to the list's
        spelling ("a1" becomes "A1", "cannon" becomes "Canon/Toshiba"). Customers are looked up live
        (/api/customers). Details are in the "Drop-down lists" part of the script below.
     6. v1.22 UI/UX:
        - Sticky table headers: on wide screens a long table in a .tablewrap scrolls inside the page, so its header
          row stays in view; rows highlight on hover.
        - Copy buttons: any element with data-copy gets a small copy icon (data-copy="text", or its own text if
          empty). Used on ticket / item / core IDs, RMAs, serials and tracking numbers.
        - Save messages (flash messages marked data-flash) appear as a toast in the top right corner. Plain
          confirmations ("Saved", "Update posted", "Moved to ...") fade after 5 seconds (hovering keeps them); anything
          else, including warnings and refusals, stays until closed (x). See TOAST_DONE / TOAST_STAYS. -->
<datalist id="dl-locations">
  {% for loc in LOCATIONS %}
    <option value="{{ loc }}">
  {% endfor %}
</datalist>
<datalist id="dl-places">
  {% for loc in PLACES %}
    <option value="{{ loc }}">
  {% endfor %}
</datalist>
<datalist id="dl-manufacturers" data-aliases='{{ MANUFACTURER_ALIASES|tojson }}'>
  {% for m in MANUFACTURERS %}
    <option value="{{ m }}">
  {% endfor %}
</datalist>
<span id="combo-config" hidden data-add-customer="{{ '1' if can('client_edit') else '' }}"></span>
<style>

<script>
  (function () {
    // ---- Rich text editors ----
    function looksLikeHtml(text) {
      return /<(div|p|br|strong|b|em|i|ol|ul|li|h1|blockquote|pre|del|a)\b/i.test(text);
    }

    function plainToHtml(text) {
      return text.split(/\n/).map(function (line) {
        var safe = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return '<div>' + (safe || '<br>') + '</div>';
      }).join('');
    }

    function upgrade(area, n) {
      var id = 'rich-' + n;
      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = area.name;
      input.id = id;
      input.value = looksLikeHtml(area.value) ? area.value : plainToHtml(area.value);
      if (!area.value.trim()) input.value = '';
      var editor = document.createElement('trix-editor');
      editor.setAttribute('input', id);
      if (area.placeholder) editor.setAttribute('placeholder', area.placeholder);
      area.parentNode.insertBefore(input, area);
      area.parentNode.insertBefore(editor, area);
      area.remove();
    }

    function loadEditors() {
      var areas = document.querySelectorAll('textarea[data-rich]');
      if (!areas.length) return;
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = '/assets/trix.css';
      document.head.appendChild(css);
      var js = document.createElement('script');
      js.src = '/assets/trix.js';
      js.onload = function () { areas.forEach(upgrade); };
      document.head.appendChild(js);
    }
    // No file attachments in notes (Trix allows drag-and-drop of files by default).
    document.addEventListener('trix-file-accept', function (e) { e.preventDefault(); });

    // ---- Money fields ----
    function moneyProblem(value) {
      var v = value.trim().replace(/[$,]/g, '');
      if (!v) return '';
      if (!/^-?\d*\.?\d*$/.test(v) || v === '.' || v === '-') return 'Enter a number, like 125.50';
      if (parseFloat(v) < 0) return 'Costs can’t be negative. Remove the minus sign.';
      return '';
    }

    // ---- Drop-down lists (v1.14: drawn by the app instead of the browser) ----
    // <input data-combo="dl-locations|dl-places|dl-manufacturers|dl-products|customers">
    //  * Opens on click or typing, filters ignoring case and spaces, shows 8 rows then scrolls.
    //  * Arrow keys move, Enter picks, Esc closes. Browser autofill is turned off on these fields.
    //  * data-strict: the value must come from the list (red message + submit greyed out otherwise).
    //    data-current="<old value>" lets an unchanged old value stay.
    //  * customers: looked up live from /api/customers, so a customer added in another tab shows up
    //    without refreshing. Leaving the box with exactly one match fills it in.
    //  * dl-products: picking a product fills a blank manufacturer and sets the row's hidden product_id.
    //    data-catalog-note shows a yellow note when the model isn't in the Product Database.
    function squash(v) { return String(v || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
    function words(v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim(); }
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
      });
    }
    function kind(input) { return input.getAttribute('data-combo') || ''; }
    function scopeOf(input) { return input.closest('.row') || input.form || document; }
    function aliasesOf(id) {
      var dl = document.getElementById(id);
      try { return dl && dl.dataset.aliases ? JSON.parse(dl.dataset.aliases) : {}; } catch (e) { return {}; }
    }
    function staticOptions(id) {
      var dl = document.getElementById(id);
      if (!dl) return [];
      return Array.prototype.map.call(dl.querySelectorAll('option'), function (o) {
        var d = o.dataset;
        return { value: o.value, name: d.name || '', mfr: d.mfr || '', type: d.type || '', id: d.id || '',
                 key: squash(o.value + ' ' + (d.name || '') + ' ' + (d.mfr || '')) };
      });
    }
    // Typed text -> the list's spelling ("a1" -> "A1", "cannon" -> "Canon/Toshiba"), or undefined.
    function listMatch(input) {
      var id = kind(input), v = squash(input.value);
      if (!v || id === 'customers' || id === 'dl-products') return undefined;
      var hit = staticOptions(id).filter(function (o) { return squash(o.value) === v; })[0];
      return hit ? hit.value : aliasesOf(id)[v];
    }
    function manufacturerOf(input) {
      var m = scopeOf(input).querySelector('[data-combo="dl-manufacturers"]');
      return m ? (listMatch(m) || '') : '';
    }

    // Is this model text a catalog product? Same rules as the server (product_database.product_matcher).
    function catalogMatch(input) {
      var mfr = words(manufacturerOf(input)), raw = words(input.value), full = words(manufacturerOf(input) + ' ' + input.value);
      if (!raw) return true;
      function starts(t, k) { return k && (t === k || t.indexOf(k + ' ') === 0); }
      return staticOptions('dl-products').some(function (p) {
        if (starts(raw, words(p.name)) || starts(full, words(p.name))) return true;
        if (starts(raw, words(p.mfr + ' ' + p.value)) || starts(full, words(p.mfr + ' ' + p.value))) return true;
        return !!mfr && mfr === words(p.mfr) && starts(raw, words(p.value));
      });
    }
    function productIdBox(input) { return scopeOf(input).querySelector('input[name="product_id[]"], input[name="product_id"]'); }
    function catalogNote(input) {
      if (!input.hasAttribute('data-catalog-note')) return;
      var type = scopeOf(input).querySelector('[name="type[]"]');
      var pid = productIdBox(input);
      var show = input.value.trim() && !(pid && pid.value) && !catalogMatch(input) && (!type || type.value === 'CC');
      var box = input.parentNode.querySelector('.catalog-note');
      if (show && !box) {
        box = document.createElement('div');
        box.className = 'catalog-note';
        box.innerHTML = 'Not in the Product Database, so it won’t appear on a product page. It will be saved as ' +
          '<strong>Needs review</strong>. <a href="/products/request" target="_blank">Suggest it</a>';
        input.insertAdjacentElement('afterend', box);
      }
      if (box) box.style.display = show ? 'block' : 'none';
    }

    // ---- Customers (live) ----
    var custCache = {};
    function custKey(q) { return q.trim().toLowerCase(); }
    function custFetch(q) {
      var k = custKey(q);
      if (custCache[k] && custCache[k].data) return Promise.resolve(custCache[k].data);
      if (custCache[k]) return custCache[k].promise;
      var entry = { data: null };
      entry.promise = fetch('/api/customers?q=' + encodeURIComponent(q.trim()), { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) { entry.data = d.results || []; setTimeout(function () { delete custCache[k]; }, 15000); return entry.data; })
        .catch(function () { delete custCache[k]; return []; });
      custCache[k] = entry;
      return entry.promise;
    }
    // From a lookup result: the one customer this text means, if any.
    function custResolve(text, list) {
      var v = text.trim(), code = (v.match(/^CL-\d+/i) || [''])[0].toUpperCase();
      var exact = list.filter(function (c) {
        return c.label === v || (code ? c.code.toUpperCase() === code : squash(c.name) === squash(v));
      });
      if (exact.length === 1) return { pick: exact[0], exact: true };
      if (list.length === 1) return { pick: list[0], exact: false };
      return { pick: null, count: list.length };
    }
    function custOk(input) {
      var v = input.value.trim();
      return !v || v === input.dataset.okValue || (input.dataset.current && squash(v) === squash(input.dataset.current));
    }
    function fillCustomer(input, c) {
      var changed = input.value !== c.label;
      input.value = c.label;
      input.dataset.okValue = c.label;
      input.dataset.state = 'ok';
      if (changed) {
        input.classList.add('combo-filled');
        setTimeout(function () { input.classList.remove('combo-filled'); }, 1200);
      }
    }
    // Look the typed text up; final=true (leaving the box or saving) fills in a single match.
    function custCheck(input, final) {
      var v = input.value.trim();
      if (custOk(input)) { input.dataset.state = 'ok'; if (input.form) checkForm(input.form); return Promise.resolve(true); }
      input.dataset.state = 'looking';
      return custFetch(v).then(function (list) {
        if (input.value.trim() !== v) return false;
        var r = custResolve(v, list);
        if (r.pick && (final || r.exact)) { fillCustomer(input, r.pick); if (input.form) checkForm(input.form); return true; }
        // While typing, several matches is fine (pick from the open list); it only turns red after leaving the box.
        input.dataset.state = r.pick ? 'one' : (r.count ? (final ? 'many' : 'typing') : 'none');
        if (input.form) checkForm(input.form);
        if (final && input.dataset.state === 'many' && document.activeElement === input) openList(input);
        return false;
      });
    }

    // ---- Validation (pick lists and money) ----
    function pickProblem(input) {
      if (input.readOnly || input.disabled) return null;
      var v = input.value.trim(), id = kind(input);
      if (id === 'customers') {
        if (custOk(input)) return null;
        var st = input.dataset.state;
        if (st === 'none') return { text: 'No customer by that name' };
        if (st === 'many') return { text: 'Pick one of the matching customers' };
        return null;          // still typing / one match: filled in when you leave the box or save
      }
      if (!v || listMatch(input)) return null;
      if (input.dataset.current && squash(v) === squash(input.dataset.current)) return null;
      return { text: id === 'dl-manufacturers' ? 'Pick a manufacturer from the list' : 'Pick a location from the list' };
    }

    // One message box under a field, created when needed.
    function note(input, cls, text) {
      var box = input.parentNode.querySelector('.' + cls);
      if (text && !box) {
        box = document.createElement('div');
        box.className = cls;
        input.insertAdjacentElement('afterend', box);
      }
      if (box) {
        box.textContent = text;
        box.style.display = text ? 'block' : 'none';
      }
    }

    function checkForm(form) {
      var bad = false;
      form.querySelectorAll('input[data-money], input[data-strict]').forEach(function (input) {
        var problem = input.hasAttribute('data-money') ? moneyProblem(input.value) : ((pickProblem(input) || {}).text || '');
        input.classList.toggle('money-bad', !!problem);
        note(input, 'money-warn', problem);
        bad = bad || !!problem;
      });
      form.querySelectorAll('button:not([type=button])').forEach(function (b) {
        b.disabled = bad;
        b.title = bad ? 'Fix the highlighted field first' : '';
      });
    }

    // ---- The list itself ----
    var box = null, scroller = null, foot = null, owner = null, items = [], active = -1, typed = false, picking = false, timer = null;
    function ensureBox() {
      if (box) return;
      box = document.createElement('div');
      box.className = 'combo-list';
      box.setAttribute('role', 'listbox');
      scroller = document.createElement('div');
      scroller.className = 'combo-scroll';
      foot = document.createElement('a');
      foot.className = 'combo-foot';
      foot.href = '/clients/new';
      foot.target = '_blank';
      foot.textContent = '+ Add new customer';
      box.appendChild(scroller);
      box.appendChild(foot);
      box.addEventListener('mousedown', function (e) { if (e.target !== foot) e.preventDefault(); });   // keep focus in the box
      scroller.addEventListener('click', function (e) {
        var row = e.target.closest('.combo-item');
        if (row && owner) pick(owner, items[+row.dataset.i]);
      });
      document.body.appendChild(box);
    }
    function place() {
      if (!box || !owner) return;
      var r = owner.getBoundingClientRect();
      box.style.left = (r.left + window.scrollX) + 'px';
      box.style.top = (r.bottom + window.scrollY + 2) + 'px';
      box.style.width = Math.max(r.width, Math.min(320, window.innerWidth - r.left - 8)) + 'px';
    }
    function closeList() {
      if (box) box.style.display = 'none';
      if (owner) owner.setAttribute('aria-expanded', 'false');
      owner = null; items = []; active = -1;
    }
    function itemsFor(input, all) {
      var id = kind(input), v = squash(input.value);
      if (id === 'customers') return Promise.resolve(null);
      var opts = staticOptions(id);
      if (id === 'dl-products') {
        var mfr = manufacturerOf(input);
        if (mfr) opts = opts.filter(function (o) { return o.mfr === mfr; });
      }
      if (v && !all) {
        var aliases = aliasesOf(id), alsoMeant = [];        // "cannon" also finds Canon/Toshiba
        Object.keys(aliases).forEach(function (k) { if (k.indexOf(v) === 0) alsoMeant.push(aliases[k]); });
        opts = opts.filter(function (o) { return o.key.indexOf(v) >= 0 || alsoMeant.indexOf(o.value) >= 0; });
      }
      return Promise.resolve(opts);
    }
    function render(input, list) {
      ensureBox();
      owner = input;
      items = list;
      active = -1;
      var id = kind(input), html = '';
      list.forEach(function (o, i) {
        if (id === 'customers') {
          html += '<div class="combo-item two" data-i="' + i + '"><strong>' + esc(o.name) + '</strong><span>' +
            esc([o.rep || 'No rep', o.code].join(' · ')) + '</span></div>';
        } else if (id === 'dl-products') {
          html += '<div class="combo-item two" data-i="' + i + '"><strong>' + esc(o.name || o.value) + '</strong><span>' +
            esc([o.mfr, o.type].filter(Boolean).join(' · ')) + '</span></div>';
        } else {
          html += '<div class="combo-item" data-i="' + i + '">' + esc(o.value) + '</div>';
        }
      });
      if (!list.length) html = '<div class="combo-empty">' + (id === 'customers' ? 'No customer by that name' : 'No matches') + '</div>';
      scroller.innerHTML = html;
      var cfg = document.getElementById('combo-config');
      foot.style.display = id === 'customers' && cfg && cfg.dataset.addCustomer ? 'block' : 'none';
      box.style.display = 'block';
      input.setAttribute('aria-expanded', 'true');
      // 8 rows, then scroll.
      scroller.style.maxHeight = 'none';
      var rows = scroller.querySelectorAll('.combo-item');
      if (rows.length > 8) scroller.style.maxHeight = rows[8].offsetTop + 'px';
      scroller.scrollTop = 0;
      place();
    }
    function openList(input, all) {
      if (input.readOnly || input.disabled) return;
      var id = kind(input);
      if (id === 'customers') {
        var q = all ? '' : input.value;
        if (custOk(input) && input.value.trim()) q = '';           // a filled-in customer: show everyone
        custFetch(q).then(function (list) {
          if (document.activeElement === input) render(input, list);
        });
        return;
      }
      itemsFor(input, all).then(function (list) { if (document.activeElement === input) render(input, list); });
    }
    function highlight(i) {
      var rows = scroller.querySelectorAll('.combo-item');
      if (!rows.length) return;
      active = (i + rows.length) % rows.length;
      rows.forEach(function (r, n) { r.classList.toggle('on', n === active); });
      rows[active].scrollIntoView({ block: 'nearest' });
    }
    function fire(input) {
      picking = true;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      picking = false;
    }
    function pick(input, o) {
      if (!o) return;
      var id = kind(input);
      if (id === 'customers') {
        fillCustomer(input, o);
      } else {
        input.value = o.value;
      }
      if (id === 'dl-products') {
        var pid = productIdBox(input);
        if (pid) pid.value = o.id;
        var m = scopeOf(input).querySelector('[data-combo="dl-manufacturers"]');
        if (m && !m.value.trim() && o.mfr) { m.value = o.mfr; fire(m); }
      }
      closeList();
      fire(input);
    }

    document.addEventListener('focusin', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('input[data-combo]'))) return;
      typed = false;
      openList(t, true);
    });
    document.addEventListener('mousedown', function (e) {
      // Clicking the field again re-opens a closed list.
      var t = e.target;
      if (t.matches && t.matches('input[data-combo]') && document.activeElement === t && (!box || box.style.display === 'none')) openList(t, true);
      else if (box && owner && !box.contains(t) && t !== owner) closeList();
    });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('input[data-combo]'))) return;
      if (picking) return;
      typed = true;
      if (kind(t) === 'dl-products') {
        var pid = productIdBox(t);
        if (pid) pid.value = '';
      }
      if (kind(t) === 'customers') {
        delete t.dataset.okValue;
        t.dataset.state = 'typing';
        clearTimeout(timer);
        timer = setTimeout(function () {
          custCheck(t, false);
          if (document.activeElement === t) openList(t, false);
        }, 150);
      } else if (document.activeElement === t) {
        openList(t, false);
      }
    });
    document.addEventListener('keydown', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('input[data-combo]'))) return;
      var open = box && box.style.display !== 'none' && owner === t;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!open) { openList(t, !typed); return; }
        highlight(active + (e.key === 'ArrowDown' ? 1 : -1));
      } else if (e.key === 'Enter' && open) {
        e.preventDefault();                       // Enter picks from the list; it doesn't save the form
        if (active >= 0) pick(t, items[active]);
        else if (items.length === 1) pick(t, items[0]);
        else closeList();
      } else if (e.key === 'Escape' && open) {
        e.preventDefault();
        closeList();
      } else if (e.key === 'Tab' && open) {
        closeList();
      }
    });
    document.addEventListener('focusout', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('input[data-combo]'))) return;
      if (owner === t) closeList();
      if (kind(t) === 'customers' && !t.readOnly) custCheck(t, true);
    });
    // Leaving a list field: use the list's spelling.
    document.addEventListener('change', function (e) {
      var t = e.target;
      if (!(t.matches && t.matches('input[data-combo]'))) return;
      var match = listMatch(t);
      if (match && match !== t.value) t.value = match;
      if (kind(t) === 'dl-products') catalogNote(t);
      if (kind(t) === 'dl-manufacturers') {
        var p = scopeOf(t).querySelector('[data-combo="dl-products"]');
        if (p) catalogNote(p);
      }
      if (t.form) checkForm(t.form);
    });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.matches && t.matches('input[data-money], input[data-strict]') && t.form) checkForm(t.form);
    });
    // Saving: fill in single customer matches first (the server checks again anyway).
    document.addEventListener('submit', function (e) {
      var form = e.target, waiting = [];
      form.querySelectorAll('input[data-combo="customers"]').forEach(function (input) {
        if (!input.readOnly && !custOk(input)) waiting.push(input);
      });
      if (!waiting.length) return;
      e.preventDefault();
      Promise.all(waiting.map(function (input) { return custCheck(input, true); })).then(function (ok) {
        if (!ok.every(Boolean)) return;
        var by = e.submitter && e.submitter.form === form ? e.submitter : null;
        if (form.requestSubmit) form.requestSubmit(by || undefined); else form.submit();
      });
    }, true);
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    // Other page scripts (e.g. receiving rows switching type) can ask for a re-check.
    window.comboRefresh = function (input) {
      if (kind(input) === 'dl-products') catalogNote(input);
      if (input.form) checkForm(input.form);
    };

    function setupCombos() {
      var forms = [];
      document.querySelectorAll('input[data-combo]').forEach(function (input) {
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('autocorrect', 'off');
        input.setAttribute('spellcheck', 'false');
        input.setAttribute('aria-autocomplete', 'list');
        if (kind(input) === 'customers' && input.value.trim() && !input.readOnly) custCheck(input, true);
        if (kind(input) === 'dl-products') catalogNote(input);
        if (input.form && input.value.trim() && forms.indexOf(input.form) < 0) forms.push(input.form);
      });
      forms.forEach(checkForm);
    }

    // ---- Work time: Start / End -> Total hours ----
    function updateTotals(form) {
      var start = form.querySelector('[data-time=start]'), end = form.querySelector('[data-time=end]');
      var out = form.querySelector('[data-time-total]');
      if (!start || !end || !out) return;
      var a = start.value.split(':'), b = end.value.split(':');
      out.classList.remove('time-bad');
      if (!start.value || !end.value) { out.textContent = '—'; return; }
      var mins = (+b[0] * 60 + +b[1]) - (+a[0] * 60 + +a[1]);
      if (mins <= 0) { out.textContent = 'End must be after start'; out.classList.add('time-bad'); return; }
      out.textContent = (mins / 60).toFixed(2) + ' hrs';
    }
    ['input', 'change'].forEach(function (type) {
      document.addEventListener(type, function (e) {
        if (e.target.matches && e.target.matches('[data-time]') && e.target.form) updateTotals(e.target.form);
      });
    });

    // ---- Unsaved changes (v1.17) ----
    // A form marked data-unsaved (ticket updates, + New Inventory, new repair ticket) asks before the page is left
    // with something typed in it. Saving the form clears the warning.
    function markDirty(e) {
      var form = e.target.closest && e.target.closest('form[data-unsaved]');
      if (form) form.dataset.dirty = '1';
    }
    document.addEventListener('input', markDirty);
    document.addEventListener('change', markDirty);
    document.addEventListener('trix-change', markDirty);
    document.addEventListener('submit', function (e) { if (e.target.dataset) delete e.target.dataset.dirty; });
    window.addEventListener('beforeunload', function (e) {
      if (document.querySelector('form[data-unsaved][data-dirty]')) { e.preventDefault(); e.returnValue = ''; }
    });

    // ---- "/" jumps to search (v1.17) ----
    document.addEventListener('keydown', function (e) {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT|TRIX-EDITOR)$/.test(t.tagName))) return;
      var home = document.querySelector('.gsearch-home input');
      var sec = document.querySelector('.ccm-search');
      var input = home || (sec && sec.querySelector('input'));
      if (!input) return;
      e.preventDefault();
      if (!home && sec && !sec.classList.contains('open')) {
        var btn = sec.querySelector('.ccm-sec-btn');
        if (btn && getComputedStyle(btn).display !== 'none') btn.click();
      }
      input.focus();
      input.select && input.select();
    });

    // ---- Favorites and recent pages ----
    function pageLabel() {
      var h = document.querySelector('main h1, .content h1, h1');
      return (h ? h.innerText : document.title).trim().slice(0, 120);
    }
    function setupFavorite() {
      if (location.pathname === '/') return;
      var url = location.pathname + location.search;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'favbtn';
      btn.textContent = '☆ Favorite';
      document.body.appendChild(btn);
      function show(on) { btn.classList.toggle('on', on); btn.textContent = on ? '★ Favorited' : '☆ Favorite'; }
      fetch('/api/favorite?url=' + encodeURIComponent(url)).then(function (r) { return r.json(); }).then(function (d) { show(d.fav); }).catch(function () {});
      btn.addEventListener('click', function () {
        fetch('/api/favorite', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url, label: pageLabel() }) })
          .then(function (r) { return r.json(); }).then(function (d) { show(d.fav); }).catch(function () {});
      });
      fetch('/api/page-visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url, label: pageLabel() }) }).catch(function () {});
    }


    // ---- v1.22: copy buttons (data-copy) ----
    var COPY_ICON = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
    var CHECK_ICON = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return new Promise(function (done) {
        var t = document.createElement('textarea');
        t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (e) {}
        t.remove(); done();
      });
    }
    function setupCopy() {
      document.querySelectorAll('[data-copy]').forEach(function (el) {
        var text = (el.getAttribute('data-copy') || el.textContent || '').trim();
        if (!text || el.querySelector('.copy-btn') || (el.nextElementSibling && el.nextElementSibling.classList.contains('copy-btn'))) return;
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-btn'; b.title = 'Copy ' + text; b.setAttribute('aria-label', 'Copy ' + text);
        b.innerHTML = COPY_ICON;
        b.addEventListener('click', function (e) {
          e.preventDefault(); e.stopPropagation();
          copyText(text).then(function () {
            b.classList.add('done'); b.innerHTML = CHECK_ICON; b.title = 'Copied';
            setTimeout(function () { b.classList.remove('done'); b.innerHTML = COPY_ICON; b.title = 'Copy ' + text; }, 1400);
          });
        });
        el.insertAdjacentElement('afterend', b);
        if (el.parentElement && el.parentElement.tagName === 'TD') el.parentElement.style.whiteSpace = 'nowrap';
      });
    }
    // ---- v1.22: save messages as toasts (data-flash) ----
    // Only plain confirmations fade (after 5 seconds): a message that says something was done (TOAST_DONE) and
    // doesn't read like a problem (TOAST_STAYS). Anything else, including warnings, stays until closed.
    var TOAST_DONE = /\b(saved|posted|moved|created|recorded|changed|updated|added|sent|linked|closed|restored|converted|returned|removed|deleted|received|opened|now)\b/i;
    var TOAST_STAYS = /^\u26a0|can't|cannot|not allowed|not saved|not sent|isn't|is not|must|required|refused|already|too large|invalid|pick |enter |choose |write |no customer|confirm|only /i;
    function setupToasts() {
      var flashes = document.querySelectorAll('[data-flash]');
      if (!flashes.length) return;
      var box = document.createElement('div');
      box.className = 'toasts'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
      flashes.forEach(function (f) {
        var text = f.textContent.trim(), stay = TOAST_STAYS.test(text) || !TOAST_DONE.test(text) || f.classList.contains('warn');
        var t = document.createElement('div');
        t.className = 'toast' + (stay ? ' stay' : '');
        var msg = document.createElement('div'); msg.textContent = text;
        var x = document.createElement('button'); x.type = 'button'; x.className = 'toast-x'; x.setAttribute('aria-label', 'Close'); x.textContent = '\u00d7';
        t.appendChild(msg); t.appendChild(x); box.appendChild(t);
        f.remove();
        function close() { t.classList.add('gone'); setTimeout(function () { t.remove(); }, 450); }
        x.addEventListener('click', close);
        if (!stay) {
          var timer = setTimeout(close, 5000);
          t.addEventListener('mouseenter', function () { clearTimeout(timer); });
          t.addEventListener('mouseleave', function () { timer = setTimeout(close, 2500); });
        }
      });
    }
    function start() { loadEditors(); setupFavorite(); setupCombos(); setupCopy(); setupToasts(); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
</script>
